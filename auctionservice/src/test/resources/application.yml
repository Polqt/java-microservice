# Test configuration. Shadows src/main/resources/application.yml on the test classpath.
# Datasource and RabbitMQ come from Testcontainers via @ServiceConnection, so they
# are deliberately absent here.
spring:
  application:
    name: auctionservice

  jpa:
    hibernate:
      # Fresh container per run, so build the schema from the entities.
      ddl-auto: create-drop
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # A jwk-set-uri (unlike issuer-uri) is not fetched at startup, so no
          # Keycloak is needed. Tests inject the Authentication directly via
          # SecurityMockMvcRequestPostProcessors.jwt(), so this is never called.
          jwk-set-uri: http://localhost:0/.well-known/jwks.json

# No service registry in tests.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
