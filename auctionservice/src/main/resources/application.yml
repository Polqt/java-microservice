server:
  port: 8082

spring:
  application:
    name: auctionservice

  datasource:
    # Database-per-service: the name is fixed by which service this is, not by environment.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/auctionservice
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}