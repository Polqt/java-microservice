server:
  port: 8082

spring:
  application:
    name: auctionservice

  datasource:
    # Database-per-service: the name is fixed by which service this is, not by environment.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/auctionservice
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it.
      # Regenerate the baseline with schema-generation scripts if entities change.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  # Sibling of jpa, not nested inside it.
  flyway:
    enabled: true
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}